project_name: SplatROM
python_version: "3.10"

compute:
  local_gpu_training: false
  local_max_ram_gb: 8
  local_gpu_vram_gb: 2
  cloud_gpu_for_4dgs: true

dataset:
  name: H2O
  dataset_root: "data/raw/h2o"
  initial_mode: pose_only
  initial_subjects: [subject1]
  max_sequences: 1
  max_frames_per_sequence: 120
  # Keep frame/image resolution small during the first cloud baseline.
  image_max_width: 640
  image_max_height: 360

experiments:
  subject_independent_split: true
  corruptions:
    - clean
    - frame_drop
    - partial_occlusion
    - motion_blur
  report_metrics:
    - joint_angle_mae_deg
    - joint_angle_rmse_deg
    - temporal_jitter_deg
    - calibration_error
    - risk_coverage_auc
