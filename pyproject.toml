[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splatom"
version = "0.1.0"
description = "Measurement reliability for biomechanical hand-motion analysis from dynamic 3D representations"
requires-python = ">=3.10,<3.12"

[tool.setuptools.packages.find]
where = ["src"]
